name: Apply and verify runtime audit repair

on:
  push:
    branches: [fix/runtime-audit-20260930]
    paths: ['.github/workflows/apply-audit.yml']

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'babyzmz/FairyStudio' && github.ref == 'refs/heads/fix/runtime-audit-20260930'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply checked regression-test corrections
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          edits = [
              ('Tests/FairyStudioTests/AssistantSessionTests.swift',
               '30b9d08460f4bddd55e63e7dc4d6e340645c4c185e37c84e7ecacee6bebce628',
               '515b767080be2919dfa0f4c1ffcc7c292dcd7b9a53e2328e1a9c965629e01651',
               'func isolatedSettings() -> AssistantSettingsModel {',
               '@MainActor\nfunc isolatedSettings() -> AssistantSettingsModel {'),
              ('Packages/FairyCore/Tests/ProjectCoreTests/ZipImportTests.swift',
               'bd9f0701d923baaebc411c12ecf95a8dc83cba4280455e6ffe9f60a2c6fd4664',
               '12d392dc225b3a31a4e379a51652aa01b64b9045b024a2be3f224195b2b5ce2d',
               '#expect(snap.file(path: "Sources/App.swift") != nil)',
               '#expect(snap.file(path: "Sources/random-dir/App.swift")?.contents == code)\n        #expect(snap.file(path: "Sources/App.swift") == nil, "导入应保留目录，不压平同名文件")')
          ]
          prepared = []
          for name, before, after, old, new in edits:
              path = Path(name)
              original = path.read_text()
              assert hashlib.sha256(original.encode()).hexdigest() == before, name
              assert original.count(old) == 1, name
              fixed = original.replace(old, new)
              assert hashlib.sha256(fixed.encode()).hexdigest() == after, name
              prepared.append((path, fixed))
          for path, fixed in prepared:
              path.write_text(fixed)
          PY
          git diff --check
          git diff --stat
      - name: Commit to repair branch only (never force-push)
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Tests/FairyStudioTests/AssistantSessionTests.swift Packages/FairyCore/Tests/ProjectCoreTests/ZipImportTests.swift
          git commit -m 'test: align ZIP regression with preserved paths and isolate settings factory'
          git push origin HEAD:refs/heads/fix/runtime-audit-20260930
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: apply
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.commit }}
          persist-credentials: false
      - name: Record actual Apple toolchain
        run: |
          swift --version
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list devices available
          git rev-parse HEAD > "$RUNNER_TEMP/revision.txt"
          git archive --format=zip HEAD -o "$RUNNER_TEMP/FairyStudio-fixed-source.zip"
      - name: Swift package regression tests
        id: package
        run: |
          set -o pipefail
          swift test --package-path Packages/FairyCore --jobs 2 2>&1 | tee "$RUNNER_TEMP/package-tests.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-regression-${{ needs.apply.outputs.commit }}
          path: ${{ runner.temp }}/package-tests.log
          retention-days: 7
      - name: iOS 27 simulator app unit tests
        if: always() && steps.package.outcome != 'cancelled'
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          ids = [d['udid'] for runtime, devices in data['devices'].items() if '.iOS-27' in runtime for d in devices if d['name'].startswith('iPhone') and d.get('isAvailable')]
          if not ids:
              raise SystemExit('No iOS 27 iPhone simulator available. Do not downgrade the deployment target.')
          with open(os.environ['RUNNER_TEMP'] + '/device-id.txt', 'w') as f:
              f.write(ids[0])
          PY
          set -o pipefail
          xcodebuild test -project FairyStudio.xcodeproj -scheme FairyStudio -destination "platform=iOS Simulator,id=$(cat "$RUNNER_TEMP/device-id.txt")" -only-testing:FairyStudioTests -parallel-testing-enabled NO -jobs 2 CODE_SIGNING_ALLOWED=NO -resultBundlePath "$RUNNER_TEMP/AppTests.xcresult" 2>&1 | tee "$RUNNER_TEMP/app-tests.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-audit-verified-${{ needs.apply.outputs.commit }}
          path: |
            ${{ runner.temp }}/revision.txt
            ${{ runner.temp }}/FairyStudio-fixed-source.zip
            ${{ runner.temp }}/package-tests.log
            ${{ runner.temp }}/app-tests.log
            ${{ runner.temp }}/AppTests.xcresult
          retention-days: 7
